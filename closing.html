<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>التقفيل</title>

<link rel="stylesheet" href="style.css">

<style>
.wrapper {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin: 20px;
}

table {
    width: 45%;
    background: white;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

input {
    width: 90%;
    border: none;
    outline: none;
    text-align: center;
}

.center-box {
    text-align: center;
    margin-top: 20px;
    color: white;
    font-size: 20px;
}
</style>

</head>

<body>

<!-- الناف بار -->
<div class="nav">
    <a href="index.html">الرئيسية</a>
    <a href="daily.html">العمولة</a>
    <a href="lines.html">الخطوط</a>
    <a href="closing.html">التقفيل</a>
</div>

<!-- التحصيل -->
<div class="center-box">
    التحصيل اليومي: <span id="net">0</span>
</div>

<div class="wrapper">

<!-- ================== علينا (يمين) ================== -->
<table id="outTable">
<tr><th colspan="2">علينا</th></tr>
<tr>
    <th>البند</th>
    <th>المبلغ</th>
</tr>

<tbody>
<script>
for(let i=0;i<20;i++){
document.write(`
<tr>
<td><input></td>
<td><input type="number" oninput="calcClosing()"></td>
</tr>
`);
}
</script>
</tbody>

<tr>
    <th>الإجمالي</th>
    <th id="outTotal">0</th>
</tr>
</table>


<!-- ================== لينا (شمال) ================== -->
<table id="inTable">
<tr><th colspan="2">لينا</th></tr>
<tr>
    <th>البند</th>
    <th>المبلغ</th>
</tr>

<tbody>
<script>
for(let i=0;i<20;i++){
document.write(`
<tr>
<td><input></td>
<td><input type="number" oninput="calcClosing()"></td>
</tr>
`);
}
</script>
</tbody>

<tr>
    <th>الإجمالي</th>
    <th id="inTotal">0</th>
</tr>
</table>

</div>

<!-- زرار تصفير -->
<div style="text-align:center; margin-top:10px;">
    <button onclick="resetClosing()">🔄 تصفير</button>
</div>

<script src="closing.js"></script>

</body>
</html>
